spring.application.name=sueldos_arvensis

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never
server.port=${SERVER_PORT:8080}

# Mismo secreto e issuer que el backend de Gestion: valida el mismo JWT, no hay login propio.
api.security.secret=${JWT_SECRET:development_secret_key_change_in_production}

# Logins con acceso a esta app, separados por coma. Todo lo demas es 403 aunque el token sea valido.
app.acceso.permitidos=${SUELDOS_LOGINS_PERMITIDOS:facumoya}
