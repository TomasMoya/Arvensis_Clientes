<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trazabilidad — Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles_trazabilidad.css" />

</head>
<body>

<div class="layout">

  <!-- ─── SIDEBAR ─── -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="logo-name">Clientes</div>
      <div class="logo-sub">v2.2 · arvensis</div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Profesionales
      </a>
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Trazabilidad
      </a>
      <a class="nav-item" href="../sin-compra/sin-compra.html" id="nav-sin-compra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Sin compra
        <span class="nav-dot" id="nav-dot-sincompra" style="display:none"></span>
      </a>
      <a class="nav-item" href="../usuarios/usuarios.html" id="nav-usuarios" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Usuarios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div>localhost:8080</div>
    </div>
  </aside>

  <!-- ─── MAIN ─── -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <a class="back-btn" href="../index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div>
          <div class="page-title" id="topbar-title">Trazabilidad</div>
          <div class="page-sub" id="topbar-sub">Cargando...</div>
        </div>
      </div>
    </header>

    <main class="content">

      <!-- Profesional card -->
      <div class="prof-card" id="prof-card">
        <div class="avatar-lg av-blue skeleton" style="width:52px;height:52px;"> </div>
        <div class="prof-info">
          <div class="prof-name"><span class="skeleton" style="width:180px;height:18px;"> </span></div>
          <div class="prof-meta" style="margin-top:8px;">
            <span class="skeleton" style="width:120px;height:13px;"> </span>
            <span class="skeleton" style="width:140px;height:13px;"> </span>
          </div>
        </div>
      </div>

      <!-- Steps -->
      <div class="section-title">Pasos de seguimiento</div>
      <div class="steps" id="steps">
        <!-- se renderizan dinámicamente -->
      </div>

    </main>
  </div>

<!-- ─── TOAST ─── -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </span>
  <span id="toast-msg"></span>
</div>

<script src="trazabilidad_script.js"></script>
