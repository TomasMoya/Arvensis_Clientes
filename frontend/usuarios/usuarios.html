<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — Arvensis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles_usuarios.css" />
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="logo-name">Clientes</div>
      <div class="logo-sub">v2.2 · arvensis</div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clientes
      </a>
      <a class="nav-item" href="../sin-compra/sin-compra.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Sin compra
        <span class="nav-dot" id="nav-dot-sincompra" style="display:none"></span>
      </a>
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Usuarios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div>localhost:8080</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="page-title">Gestión de usuarios</div>
        <div class="page-sub" id="page-sub">Cargando...</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo usuario
        </button>
      </div>
    </header>

    <main class="content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Login</th>
              <th>Rol</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="4" class="empty-state"><div>Cargando...</div></td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- MODAL CREAR -->
<div class="modal-overlay" id="modal-add" onclick="if(event.target===this)closeModal('modal-add')">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Nuevo usuario</div>
        <div class="modal-sub">Completá todos los campos.</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-add')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">Nombre *</label>
        <input type="text" id="f-nombre" placeholder="Nombre completo" />
      </div>
      <div class="form-row">
        <label class="form-label">Login *</label>
        <input type="text" id="f-login" placeholder="nombre_usuario" />
      </div>
      <div class="form-row">
        <label class="form-label">Contraseña *</label>
        <input type="password" id="f-clave" placeholder="Contraseña segura" />
      </div>
      <div class="form-row">
        <label class="form-label">Rol *</label>
        <select id="f-rol">
          <option value="USER">User</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-error" id="form-error">Completá todos los campos.</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-add')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitForm()">Crear usuario</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMAR ELIMINAR -->
<div class="modal-overlay" id="modal-confirm" onclick="if(event.target===this)closeModal('modal-confirm')">
  <div class="modal confirm-modal">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div class="confirm-title">¿Eliminar usuario?</div>
    <div class="confirm-sub" id="confirm-sub">Esta acción no se puede deshacer.</div>
    <div class="modal-footer" style="justify-content:center; margin-top:18px;">
      <button class="btn" onclick="closeModal('modal-confirm')">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarEliminar()">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </span>
  <span id="toast-msg"></span>
</div>

<script src="usuarios_script.js"></script>
</body>
</html>
