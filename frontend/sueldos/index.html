<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Liquidación de haberes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FBFBFD;
  --texto:#1D1D1F; --suave:#6E6E73; --tenue:#86868B;
  --sep:#D2D2D7; --sep-2:#E8E8ED;
  --azul:#0071E3; --azul-2:#0077ED; --azul-cl:#E8F1FD;
  --verde:#1D8A3F; --verde-cl:#E7F5EC;
  --rojo:#D70015; --rojo-cl:#FDEDEC;
  --ambar:#9A6800; --ambar-cl:#FDF4E3;
  --edp:#1D1D1F; --aromaherba:#7A3EC7; --arvensis:#4C7A3E;
  --r:12px; --r-sm:8px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --serif:var(--sans);
  --sombra:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--texto);font-size:14px;line-height:1.47;
  letter-spacing:-.008em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul);text-decoration:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:rgba(245,245,247,.72);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-right:1px solid var(--sep-2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 14px}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.brand span{display:block;font-size:12px;color:var(--tenue);margin-top:1px}
.nav{padding:4px 10px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--texto);
  padding:7px 10px;text-align:left;cursor:pointer;font-size:13.5px;border-radius:var(--r-sm);margin-bottom:1px}
.nav button:hover{background:rgba(0,0,0,.045)}
.nav button.on{background:var(--azul);color:#fff;font-weight:500}
.nav button.on .ico{opacity:1}
.nav .ico{width:17px;text-align:center;opacity:.5;font-size:13px}
.side-foot{padding:12px 18px;border-top:1px solid var(--sep-2);font-size:11.5px;color:var(--tenue);line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep-2);padding:14px 28px;display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h2{font-size:22px;font-weight:600;letter-spacing:-.022em}
.top .sub{font-size:12.5px;color:var(--tenue);margin-top:1px}
.top .sp{flex:1}
.wrap{padding:24px 28px 72px;max-width:1220px;width:100%}

/* ---------- controles ---------- */
.btn{background:var(--azul);color:#fff;border:1px solid transparent;padding:6px 15px;border-radius:980px;
  cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--azul-2)}
.btn.ghost{background:rgba(0,0,0,.05);color:var(--texto)}
.btn.ghost:hover{background:rgba(0,0,0,.09)}
.btn.acc{background:var(--azul)}
.btn.dgr{background:transparent;color:var(--rojo);border-color:transparent}
.btn.dgr:hover{background:var(--rojo-cl)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.ln:focus-visible,.nav button:focus-visible{outline:3px solid #0071E355;outline-offset:1px}
.ln{background:none;border:0;color:var(--azul);cursor:pointer;font-size:12.5px;padding:0}
.ln:hover{text-decoration:underline}
.ln.dgr{color:var(--rojo)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{
  border:1px solid var(--sep);background:var(--surface);border-radius:var(--r-sm);padding:7px 10px;width:100%;
  font-size:13.5px;appearance:none}
select{background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236E6E73' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 3px #0071E326}
label{display:block;font-size:12px;color:var(--suave);margin-bottom:5px}
.f{margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px}
.chk input{width:auto;accent-color:var(--azul)}

/* ---------- superficies ---------- */
.panel{background:var(--surface);border:1px solid var(--sep-2);border-radius:var(--r);margin-bottom:18px;
  box-shadow:var(--sombra);overflow:hidden}
.panel>h3{font-size:15px;font-weight:600;letter-spacing:-.015em;padding:14px 18px;
  border-bottom:1px solid var(--sep-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h3 .sp{flex:1}
.panel .body{padding:16px 18px}
.note{font-size:12.5px;color:var(--tenue);line-height:1.45}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:980px;background:rgba(0,0,0,.05);color:var(--suave);font-weight:500}
.tag.ok{color:var(--verde);background:var(--verde-cl)}
.tag.no{color:var(--rojo);background:var(--rojo-cl)}
.tag.acc{color:var(--ambar);background:var(--ambar-cl)}
.punto{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:500;color:var(--tenue);text-align:left;padding:9px 14px;
  border-bottom:1px solid var(--sep-2);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--sep-2);vertical-align:middle;font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.tscroll{overflow-x:auto}
.empty{padding:44px 18px;text-align:center;color:var(--tenue);font-size:13px}
.empty strong{display:block;color:var(--texto);font-weight:600;margin-bottom:4px;font-size:14.5px}

/* ---------- tarjetas de resumen ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--sep-2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra)}
.kpi .k{font-size:12.5px;color:var(--suave)}
.kpi .v{font-size:28px;font-weight:600;margin-top:4px;letter-spacing:-.028em;line-height:1.1}
.kpi .m{font-size:12px;color:var(--tenue);margin-top:3px}

/* ---------- recibo ---------- */
.recibo{background:var(--surface);border:1px solid var(--sep-2);border-radius:var(--r);padding:26px 28px;max-width:760px}
.rline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--sep-2);font-size:13.5px}
.rline.tot{border-bottom:0;border-top:1px solid var(--sep);margin-top:6px;padding-top:10px;font-weight:600}
.neto{background:var(--texto);color:#fff;padding:16px 20px;border-radius:var(--r);display:flex;
  justify-content:space-between;align-items:center;margin-top:16px;gap:14px}
.neto .l{font-size:12.5px;color:#ffffffa6}
.neto .v{font-size:28px;font-weight:600;letter-spacing:-.028em}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;padding:44px 16px;z-index:60;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 64px rgba(0,0,0,.24)}
.modal.wide{max-width:920px}
.modal h3{font-size:16px;font-weight:600;letter-spacing:-.015em;padding:18px 22px;border-bottom:1px solid var(--sep-2)}
.modal .mbody{padding:20px 22px;max-height:68vh;overflow-y:auto}
.modal .mfoot{padding:14px 22px;border-top:1px solid var(--sep-2);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- avisos ---------- */
.toast{position:fixed;right:20px;bottom:20px;background:rgba(29,29,31,.94);backdrop-filter:blur(10px);
  color:#fff;padding:12px 17px;border-radius:var(--r);font-size:13px;z-index:90;opacity:0;
  transform:translateY(10px);transition:.22s cubic-bezier(.32,.72,0,1);pointer-events:none;max-width:340px;
  box-shadow:0 8px 28px rgba(0,0,0,.2)}
.toast.on{opacity:1;transform:none}
.toast.bad{background:rgba(215,0,21,.95)}
.alerta{border:1px solid #F0DFB8;background:var(--ambar-cl);color:#7A5200;padding:11px 14px;
  border-radius:var(--r-sm);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.drop{border:1.5px dashed var(--sep);border-radius:var(--r);padding:34px 20px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--azul);background:var(--azul-cl)}
.drop strong{display:block;font-size:14.5px;margin-bottom:4px}
.pos{color:var(--verde)}.neg{color:var(--rojo)}
.hide{display:none!important}


.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius);
  font-size: 13.5px; color: var(--text-2);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  font-weight: 400;
  text-decoration: none;
}

.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg { opacity: 1; }


/* ---------- control segmentado ---------- */
.seg{display:inline-flex;background:rgba(0,0,0,.05);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;
  color:var(--suave);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--texto);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--sep-2);z-index:30}
  .brand{padding:12px 16px;white-space:nowrap}
  .brand span{display:none}
  .nav{display:flex;padding:6px}
  .nav button{padding:7px 12px;white-space:nowrap}
  .side-foot{display:none}
  .top{position:static}
  .wrap,.top{padding-left:16px;padding-right:16px}
  .kpis,.g2,.g3,.g4{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){.kpis,.g2,.g3,.g4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><h1>Liquidación</h1><span id="brandEmp">Recursos Humanos</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><a class="nav-item" href="../selector/selector.html" style="margin-bottom:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Módulos
      </a></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h2 id="tTitle">Panel</h2><div class="sub" id="tSub"></div></div>
      <div class="sp"></div>
      <div id="tActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* =====================================================================
   LIQUIDACIÓN DE HABERES — la misma app; lo único que cambió es que el
   DB ya no vive en localStorage sino en el servidor. La UI y los cálculos
   quedaron intactos.
   ===================================================================== */

/* ------------------------- acceso ------------------------- */
if (!localStorage.getItem('tokenJWT')) {
  window.location.href = '../login/login.html';
}

/* ------------------------- almacenamiento ------------------------- */
const KEY='rrhh_liquidacion_v1';
let memoria=null;
function leerDisco(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return memoria}}

const isLocalhost = location.hostname==='localhost' || location.hostname==='127.0.0.1';
const API_SUELDOS = isLocalhost ? 'http://127.0.0.1:8081/db' : '/api/sueldos/db';
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('tokenJWT')}}

function guardar(){
  DB.actualizado=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memoria=JSON.parse(JSON.stringify(DB))}
  fetch(API_SUELDOS,{method:'PUT',headers:authHeaders(),body:JSON.stringify(DB)})
    .then(res=>{const antes=SIN_GUARDADO;SIN_GUARDADO=!res.ok;if(SIN_GUARDADO!==antes)render()})
    .catch(()=>{const antes=SIN_GUARDADO;SIN_GUARDADO=true;if(SIN_GUARDADO!==antes)render()});
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* --------------------------- datos base --------------------------- */
const SEMILLA={
  version:1,
  config:{empresa:'Recursos Humanos',cuit:'',domicilio:'',
          empresas:[{id:'edp',nombre:'Essence de Parfum',cuit:'',domicilio:'Sarmiento 166',color:'#1D1D1F'},
                    {id:'aromaherba',nombre:'Aromahérba',cuit:'',domicilio:'',color:'#7C3AED'},
                    {id:'arvensis',nombre:'Laboratorio Arvensis',cuit:'',domicilio:'Almafuerte, Córdoba',color:'#618A52'}],
          jornadaSemanal:40,jornadaDiaria:8,
          modoExtras:'semanal',factorExtra:1.5,cuotaPorDefecto:1,periodoDefecto:'quincenal'},
  empleados:[
    {nombre:'Abigail Pettiti',tarifa:6000,tarifaExtra:9000,ingreso:'2025-07-01',activo:true,formaPago:'Efectivo',vacUsados:4},
    {nombre:'Totera',tarifa:6000,tarifaExtra:9000,ingreso:'',activo:true,formaPago:'Efectivo',vacUsados:0},
    {nombre:'Ricardo Silveira',tarifa:7500,tarifaExtra:11250,ingreso:'',activo:true,formaPago:'Efectivo',vacUsados:10},
    {nombre:'Leandro Silvera',tarifa:6000,tarifaExtra:9000,ingreso:'2026-01-01',activo:true,formaPago:'Efectivo',vacUsados:0},
    {nombre:'Gonza Silveira',tarifa:6000,tarifaExtra:9000,ingreso:'2025-07-01',activo:true,formaPago:'Efectivo',vacUsados:10},
    {nombre:'Aldana',tarifa:6000,tarifaExtra:9000,ingreso:'2025-07-01',activo:true,formaPago:'Efectivo',vacUsados:8},
    {nombre:'Rocio Rubio',tarifa:6000,tarifaExtra:9000,ingreso:'2026-03-09',activo:true,formaPago:'Efectivo',vacUsados:0},
    {nombre:'Tomi',tarifa:6000,tarifaExtra:9000,ingreso:'',activo:true,formaPago:'Efectivo',vacUsados:0}
  ].map(e=>Object.assign({id:uid(),notas:'',vacDias:0,empresa:'',
      jornada:8,hEm:'08:00',hSm:'',hEt:'',hSt:'16:00',dias:[1,2,3,4,5]},e)),
  fichajes:[],movimientos:[],liquidaciones:[]
};

let DB=JSON.parse(JSON.stringify(SEMILLA));

/* ----------------------------- utilidades ----------------------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0});
const $$=n=>'$ '+fmt.format(Math.round((+n||0)*100)/100);
const $0=n=>'$ '+fmt0.format(Math.round(+n||0));
const hs=n=>fmt.format(Math.round((+n||0)*100)/100).replace(',00','');
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function hoyISO(){const d=new Date();return iso(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dLoc(s){if(!s)return null;const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c)}
function fFecha(s){const d=dLoc(s);return d?`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`:''}
function fLarga(s){const d=dLoc(s);return d?`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`:''}
function lunesDe(s){const d=dLoc(s);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return iso(d)}
function sumaDias(s,n){const d=dLoc(s);d.setDate(d.getDate()+n);return iso(d)}
function finDeMes(ym){const[y,m]=ym.split('-').map(Number);return iso(new Date(y,m,0))}
function mesActual(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
/** Quincena que contiene a una fecha: 1ª = 1 al 15, 2ª = 16 a fin de mes. */
function quincenaDe(f){const s=f||hoyISO();const ym=s.slice(0,7);const d=+s.slice(8,10);
  return d<=15?{n:1,desde:ym+'-01',hasta:ym+'-15'}:{n:2,desde:ym+'-16',hasta:finDeMes(ym)}}
function quincenasDe(ym){return[{n:1,desde:ym+'-01',hasta:ym+'-15'},{n:2,desde:ym+'-16',hasta:finDeMes(ym)}]}
function nomQuincena(q){return `${q.n}ª quincena de ${nomMes(q.desde.slice(0,7))}`}
/** Rango de fechas de un período según su tipo. */
function rangoPeriodo(tipo,ref){
  if(tipo==='semanal'){const l=lunesDe(ref);return{desde:l,hasta:sumaDias(l,6)}}
  if(tipo==='mensual'){const ym=ref.slice(0,7);return{desde:ym+'-01',hasta:finDeMes(ym)}}
  const q=quincenaDe(ref);return{desde:q.desde,hasta:q.hasta};
}
function nomPeriodo(tipo,desde,hasta){
  if(tipo==='semanal')return `Semana del ${fFecha(desde)} al ${fFecha(hasta)}`;
  if(tipo==='mensual')return `Mes de ${nomMes(desde.slice(0,7))}`;
  if(tipo==='personalizado')return `Del ${fFecha(desde)} al ${fFecha(hasta)}`;
  return nomQuincena(quincenaDe(desde));
}
function nomMes(ym){const[y,m]=ym.split('-').map(Number);return `${MESES[m-1]} ${y}`}
function empleado(id){return DB.empleados.find(e=>e.id===id)}
function nomEmp(id){const e=empleado(id);return e?e.nombre:'(eliminado)'}
function antig(ingreso){if(!ingreso)return null;const d=dLoc(ingreso);if(!d)return null;
  return Math.floor((Date.now()-d.getTime())/(365.25*24*3600*1000))}
function diasVacaciones(ingreso){const a=antig(ingreso);if(a===null)return 0;
  if(a>=20)return 35; if(a>=10)return 28; if(a>=5)return 21; if(a>=0.5)return 14; return 0}

/* Si el guardado contra el servidor falla, hay que avisarlo fuerte: mientras tanto
   los cambios solo quedan en este navegador y no se ven reflejados para nadie más. */
let SIN_GUARDADO=false;
function bannerGuardado(){
  if(!SIN_GUARDADO)return '';
  return `<div class="alerta" style="border-color:#E9B8B2;background:#FDEDEC;color:#8A1F16">

/* ------------------------ horas y períodos ------------------------ */
function horasDe(em,sm,et,st){
  const t=x=>{if(!x)return null;const p=String(x).split(':');if(p.length<2)return null;
    return (+p[0])+(+p[1])/60+((+p[2]||0)/3600)};
  const a=t(em),b=t(sm),c=t(et),d=t(st);let h=0,hay=false;
  if(a!==null&&b!==null){h+=b-a;hay=true}
  if(c!==null&&d!==null){h+=d-c;hay=true}
  if(!hay&&a!==null&&d!==null){h=d-a;hay=true}
  if(!hay&&a!==null&&b===null&&c===null&&d===null)return 0;
  return hay?Math.max(0,Math.round(h*100)/100):0;
}
function fichajesDe(empId,desde,hasta){
  return DB.fichajes.filter(f=>f.empId===empId&&f.fecha>=desde&&f.fecha<=hasta).sort((a,b)=>a.fecha<b.fecha?-1:1)}

/** Reparte horas del período en normales / extras según el modo configurado. */
function repartirHoras(fichajes){
  const cfg=DB.config;let norm=0,ext=0;
  if(cfg.modoExtras==='diario'){
    fichajes.forEach(f=>{const h=+f.horas||0;const j=+cfg.jornadaDiaria||8;
      norm+=Math.min(h,j);ext+=Math.max(0,h-j)});
  }else{
    const semanas={};
    fichajes.forEach(f=>{const k=lunesDe(f.fecha);semanas[k]=(semanas[k]||0)+(+f.horas||0)});
    const j=+cfg.jornadaSemanal||40;
    Object.values(semanas).forEach(h=>{norm+=Math.min(h,j);ext+=Math.max(0,h-j)});
  }
  return {normales:Math.round(norm*100)/100,extras:Math.round(ext*100)/100};
}

/* ---------------------- jornada habitual --------------------------- */
/* Cada empleado tiene su jornada tipo: cuántas horas, con qué horarios y qué días trabaja. */
function jornadaDe(e){return +e.jornada||+DB.config.jornadaDiaria||8}
function diasDe(e){return (e&&e.dias&&e.dias.length)?e.dias:[1,2,3,4,5]}
function horariosDe(e){return {em:e.hEm||'',sm:e.hSm||'',et:e.hEt||'',st:e.hSt||''}}
function masHoras(hhmm,horas){
  if(!hhmm)return '';
  const[h,m]=hhmm.split(':').map(Number);
  let t=h*60+m+Math.round(horas*60);t=((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
/** Horarios y horas de un día según cómo se trabajó: completa, media mañana, media tarde o falta. */
function segunModo(e,modo){
  const h=horariosDe(e),jor=jornadaDe(e);
  if(modo==='falta')return {em:'',sm:'',et:'',st:'',horas:0};
  if(modo==='completa'||!modo){
    return Object.assign({},h,{horas:horasDe(h.em,h.sm,h.et,h.st)||jor});
  }
  const mitad=Math.round((jor/2)*100)/100;
  const cortada=h.em&&h.sm&&h.et&&h.st;      // jornada con corte al mediodía
  if(modo==='media-manana'){
    if(cortada)return {em:h.em,sm:h.sm,et:'',st:'',horas:horasDe(h.em,h.sm,'','')||mitad};
    return {em:h.em,sm:h.em?masHoras(h.em,mitad):'',et:'',st:'',horas:mitad};
  }
  if(cortada)return {em:'',sm:'',et:h.et,st:h.st,horas:horasDe('','',h.et,h.st)||mitad};
  return {em:'',sm:'',et:h.st?masHoras(h.st,-mitad):'',st:h.st,horas:mitad};
}
const NOMBRE_MODO={completa:'jornada completa','media-manana':'media jornada de mañana',
  'media-tarde':'media jornada de tarde',falta:'día no trabajado'};
/** Si editás las horas, se corre el horario de salida para que el recibo sea coherente. */
function ajustarAHoras(e,modo,horas){
  const base=segunModo(e,modo);
  if(horas==null||Math.abs(horas-base.horas)<0.01)return base;
  if(horas<=0)return {em:'',sm:'',et:'',st:'',horas:0};
  const manana=horasDe(base.em,base.sm,'','');
  if(base.et&&manana&&horas>manana)                       // jornada con corte: se estira la tarde
    return {em:base.em,sm:base.sm,et:base.et,st:masHoras(base.et,horas-manana),horas};
  const entrada=base.em||base.et;                          // si no, un solo bloque desde la entrada
  if(entrada)return {em:entrada,sm:masHoras(entrada,horas),et:'',st:'',horas};
  return {em:'',sm:'',et:'',st:'',horas};
}
/** Carga la jornada completa de un día. Devuelve 'nueva', 'pisada' o 'existia'. */
function marcarJornada(empId,fecha,forzar,modo){
  const e=empleado(empId);if(!e)return 'existia';
  const h=segunModo(e,modo||'completa');
  const ex=DB.fichajes.find(f=>f.empId===empId&&f.fecha===fecha);
  if(ex&&!forzar)return 'existia';
  const datos={empId,fecha,em:h.em,sm:h.sm,et:h.et,st:h.st,horas:Math.round(h.horas*100)/100,
    obs:modo==='falta'?'No trabajó':'',auto:true,modo:modo||'completa'};
  if(ex){Object.assign(ex,datos);return 'pisada'}
  DB.fichajes.push(Object.assign({id:uid()},datos));return 'nueva';
}
/** Carga la semana de un empleado, solo en los días que trabaja habitualmente. */
function marcarSemana(empId,semana,forzar,modo){
  const e=empleado(empId);const r={nuevas:0,pisadas:0,existian:0};
  diasDe(e).forEach(d=>{
    const off=(d+6)%7;                       // lunes = 0 en la grilla
    const res=marcarJornada(empId,sumaDias(semana,off),forzar,modo);
    if(res==='nueva')r.nuevas++;else if(res==='pisada')r.pisadas++;else r.existian++;
  });
  return r;
}

/* -------------------------- movimientos --------------------------- */
/* tipos: adelanto | prestamo | bono | descuento | sac  */
function saldoPrestamo(m){return Math.max(0,(+m.monto||0)-(+m.pagado||0))}
function prestamosActivos(empId){return DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='prestamo'&&saldoPrestamo(m)>0.5)}
function adelantosPendientes(empId,hasta){
  return DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='adelanto'&&!m.saldado&&(!hasta||m.fecha<=hasta))}
function pendientesTotal(empId){
  const a=adelantosPendientes(empId).reduce((s,m)=>s+(+m.monto||0),0);
  const p=prestamosActivos(empId).reduce((s,m)=>s+saldoPrestamo(m),0);
  return {adelantos:a,prestamos:p,total:a+p};
}

  const modos=['completa','media-manana','media-tarde','falta'];
  const filas=lista.map((e,i)=>{
    const cargados=fichajesDe(e.id,sem,fin).length;

    return `<tr>

      </div></td></tr>`}).join('');

  abrir(`<h3>Cargar la semana del ${fFecha(sem)} al ${fFecha(fin)}</h3><div class="mbody">
    <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">

        <select id="cgTodos">${modos.map(m=>`<option value="${m}"${m===(modoIni||'completa')?' selected':''}>${NOMBRE_MODO[m]}</option>`).join('')}</select></div>
      <button class="btn ghost" id="cgAplicar">Aplicar a todos</button>
    </div>
    <div class="tscroll" style="max-height:46vh;overflow-y:auto;border:1px solid var(--sep-2);border-radius:var(--r-sm)">
      <table><thead><tr><th>Empleado</th><th>Cómo trabajó</th><th class="n">Horas por día</th><th>Días a cargar</th></tr></thead>
      <tbody>${filas}</tbody></table></div>
    <label class="chk" style="margin-top:14px"><input type="checkbox" id="cgPisar">
      Reemplazar los días que ya tienen horas cargadas</label>
    <p class="note" style="margin-top:8px">Si cambiás las horas, se corre el horario de salida para que el recibo cierre.
      Después podés retocar cualquier día tocándolo en la planilla.</p>
  </div><div class="mfoot"><button class="btn ghost" onclick="cerrar()">Cancelar</button>
  <button class="btn" id="cgOk">Cargar la semana</button></div>`,true);

  const leerFila=i=>({
    emp:lista[i],
    on:document.querySelector(`.cgOn[data-i="${i}"]`).checked,
    modo:document.querySelector(`.cgModo[data-i="${i}"]`).value,
    horas:+document.querySelector(`.cgHs[data-i="${i}"]`).value,
    dias:[...document.querySelectorAll(`.cgDia[data-i="${i}"]`)].filter(c=>c.checked).map(c=>+c.value)
  });
  const refrescarHoras=i=>{
    const sel=document.querySelector(`.cgModo[data-i="${i}"]`);
    document.querySelector(`.cgHs[data-i="${i}"]`).value=segunModo(lista[i],sel.value).horas;
  };
  document.querySelectorAll('.cgModo').forEach(sel=>sel.onchange=()=>refrescarHoras(sel.dataset.i));
  $('#cgAplicar').onclick=()=>{
    const m=$('#cgTodos').value;
    document.querySelectorAll('.cgModo').forEach(sel=>{sel.value=m;refrescarHoras(sel.dataset.i)});
  };
  $('#cgOk').onclick=()=>{
    const pisar=$('#cgPisar').checked;
    let nuevas=0,pisadas=0,intactas=0;
    lista.forEach((e,i)=>{
      const f=leerFila(i);
      if(!f.on||!f.dias.length)return;
      f.dias.forEach(d=>{
        const fecha=sumaDias(sem,(d+6)%7);
        const ex=DB.fichajes.find(x=>x.empId===e.id&&x.fecha===fecha);
        if(ex&&!pisar){intactas++;return}
        const h=ajustarAHoras(e,f.modo,f.horas);

        else{DB.fichajes.push(Object.assign({id:uid()},datos));nuevas++}
      });
    });
    guardar();cerrar();vHoras();
    toast(nuevas+pisadas
      ? `${nuevas} día${nuevas===1?'':'s'} cargado${nuevas===1?'':'s'}${pisadas?`, ${pisadas} reemplazado${pisadas===1?'':'s'}`:''}${intactas?`, ${intactas} quedaron como estaban`:''}`
      : 'No se cargó nada: todos los días ya tenían horas');
  };
}

/* --- conversión de celdas de hora a "HH:MM" --- */
function aHora(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  if(typeof v==='number'){let f=v%1;if(v>=1&&f===0)return '';const t=Math.round(f*24*60);
    return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
  const m=String(v).match(/(\d{1,2})[:.](\d{2})/);
  return m?String(+m[1]).padStart(2,'0')+':'+m[2]:'';
}
function aNum(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;
  const s=String(v).replace(/[^\d,.\-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.');
  const n=parseFloat(s);return isNaN(n)?0:n}
/* --- fechas escritas a mano en la planilla ("viernes 25 de julio", "VIERNES 26/07") --- */
function aFecha(v,anio){
  if(!v&&v!==0)return '';
  if(v instanceof Date)return iso(v);
  if(typeof v==='number'&&v>1000){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const s=String(v).toLowerCase().trim();
  let m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
  m=s.match(/(\d{1,2})[\/\-](\d{1,2})(?!\d)/);
  if(m)return `${anio}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  m=s.match(/(\d{1,2})\s+de\s+([a-záéíóú]+)/);
  if(m){const i=MESES.findIndex(x=>x.startsWith(m[2].slice(0,4)));
    if(i>=0)return `${anio}-${String(i+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
  return '';
}
function nombreParecido(n){
  if(!n)return null;
  const limpiar=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim();
  const t=limpiar(n);if(!t)return null;
  let e=DB.empleados.find(x=>limpiar(x.nombre)===t);if(e)return e;
  const partes=t.split(/\s+/);
  e=DB.empleados.find(x=>{const l=limpiar(x.nombre).split(/\s+/);
    return partes.some(p=>p.length>3&&l.includes(p))});
  return e||null;
}
function leerArchivo(file){
  IMPORT={filas:[],pagos:[],archivo:file.name};
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const anio=(new Date()).getFullYear();
      wb.SheetNames.forEach(nom=>{
        const g=XLSX.utils.sheet_to_json(wb.Sheets[nom],{header:1,raw:true,defval:null,blankrows:true});
        leerHojaPlanilla(g,nom,anio);
        leerHojaSimple(g,nom,anio);
        leerHistorial(g,nom,anio);
      });
      mostrarImportacion();
    }catch(err){console.error(err);$('#impRes').innerHTML=`<div class="alerta">No se pudo leer el archivo: ${esc(err.message)}. Probá guardarlo de nuevo como .xlsx.</div>`}
  };
  fr.readAsArrayBuffer(file);
}
/* Formato de la planilla actual: bloque "Día / Fecha / Entrada… / Hs Trabajadas" */
function leerHojaPlanilla(g,hoja,anio){
  const txt=(r,c)=>String((g[r]||[])[c]??'').toLowerCase().trim();
  let hdr=-1;
  for(let r=0;r<Math.min(g.length,40);r++){
    const fila=(g[r]||[]).map(x=>String(x??'').toLowerCase());
    if(fila.some(c=>c.trim()==='día'||c.trim()==='dia')&&fila.some(c=>c.includes('hs trabajadas'))){hdr=r;break}
  }
  if(hdr<0)return;
  const cab=(g[hdr]||[]).map(x=>String(x??'').toLowerCase());
  const col=n=>cab.findIndex(c=>c.includes(n));
  const cDia=0,cFec=col('fecha'),cHs=col('hs trabajadas');
  // Si la hoja perdió los rótulos de horario, se usan las columnas de siempre (C a F)
  const cEM=col('entrada mañana')>=0?col('entrada mañana'):2, cSM=col('salida mañana')>=0?col('salida mañana'):3,
        cET=col('entrada tarde')>=0?col('entrada tarde'):4, cST=col('salida tarde')>=0?col('salida tarde'):5;
  let nombre=hoja;
  for(let r=0;r<hdr;r++){const f=g[r]||[];
    const i=f.findIndex(x=>String(x??'').toLowerCase().includes('empleado:'));
    if(i>=0&&f[i+1]){nombre=String(f[i+1]);break}}
  const emp=nombreParecido(nombre)||nombreParecido(hoja);
  for(let r=hdr+1;r<Math.min(g.length,hdr+12);r++){
    const f=g[r]||[];const dia=String(f[cDia]??'').trim();
    if(!dia||/total|sueldo/i.test(dia))break;
    const idx=DIAS.findIndex(d=>d.toLowerCase()===dia.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace('miercoles','miércoles').replace('sabado','sábado'));
    const em=aHora(f[cEM]),sm=aHora(f[cSM]),et=aHora(f[cET]),st=aHora(f[cST]);
    let horas=cHs>=0?aNum(f[cHs]):0;
    if(!horas)horas=horasDe(em,sm,et,st);
    if(!horas&&!em&&!st)continue;
    const fecha=cFec>=0?aFecha(f[cFec],anio):'';
    IMPORT.filas.push({hoja,nombre,empId:emp?emp.id:'',dia:dia,diaIdx:idx<0?null:idx,
      fecha,em,sm,et,st,horas:Math.round(horas*100)/100,usar:true,origen:'planilla'});
  }
}
/* Formato simple: encabezado con Empleado + Fecha */
function leerHojaSimple(g,hoja,anio){
  let hdr=-1;
  for(let r=0;r<Math.min(g.length,15);r++){
    const f=(g[r]||[]).map(x=>String(x??'').toLowerCase());
    if(f.some(c=>c.includes('empleado'))&&f.some(c=>c.includes('fecha'))&&!f.some(c=>c.includes('concepto'))){hdr=r;break}
  }
  if(hdr<0)return;
  const cab=(g[hdr]||[]).map(x=>String(x??'').toLowerCase());
  const col=n=>cab.findIndex(c=>c.includes(n));
  const cNom=col('empleado'),cFec=col('fecha'),cEM=col('entrada mañana')>=0?col('entrada mañana'):col('entrada'),
        cSM=col('salida mañana'),cET=col('entrada tarde'),cST=col('salida tarde')>=0?col('salida tarde'):col('salida'),
        cHs=col('horas'),cObs=col('observ');
  for(let r=hdr+1;r<g.length;r++){
    const f=g[r]||[];if(!f.length)continue;
    const nombre=String(f[cNom]??'').trim();if(!nombre)continue;
    const fecha=aFecha(f[cFec],anio);if(!fecha)continue;
    const em=aHora(f[cEM]),sm=cSM>=0?aHora(f[cSM]):'',et=cET>=0?aHora(f[cET]):'',st=aHora(f[cST]);
    let horas=cHs>=0?aNum(f[cHs]):0;if(!horas)horas=horasDe(em,sm,et,st);
    if(!horas)continue;
    const emp=nombreParecido(nombre);
    IMPORT.filas.push({hoja,nombre,empId:emp?emp.id:'',dia:DIAS[dLoc(fecha).getDay()],diaIdx:null,
      fecha,em,sm,et,st,horas:Math.round(horas*100)/100,obs:cObs>=0?String(f[cObs]??''):'',usar:true,origen:'simple'});
  }
}
/* Historial de pagos ya liquidados */
function leerHistorial(g,hoja,anio){
  let hdr=-1;
  for(let r=0;r<g.length;r++){
    const f=(g[r]||[]).map(x=>String(x??'').toLowerCase());
    if(f.some(c=>c.trim()==='concepto')&&f.some(c=>c.includes('total a pagar'))){hdr=r;break}
  }
  if(hdr<0)return;
  const cab=(g[hdr]||[]).map(x=>String(x??'').toLowerCase());
  const col=n=>cab.findIndex(c=>c.includes(n));
  const c={fec:col('fecha'),con:col('concepto'),hn:col('hs normales'),he:col('hs extras'),
    sn:col('sueldo normal'),se:col('sueldo extra'),sac:col('sac'),bon:col('bonos'),
    ade:col('adelantos'),tot:col('total a pagar'),pag:col('forma de pago'),obs:col('observ')};
  let nombre=hoja;
  for(let r=0;r<hdr;r++){const f=g[r]||[];
    const i=f.findIndex(x=>String(x??'').toLowerCase().includes('empleado:'));
    if(i>=0&&f[i+1]){nombre=String(f[i+1]);break}}
  const emp=nombreParecido(nombre)||nombreParecido(hoja);
  for(let r=hdr+1;r<g.length;r++){
    const f=g[r]||[];const total=aNum(f[c.tot]);
    const con=String(f[c.con]??'').trim();
    if(!con&&!total)continue;
    const bruta=f[c.fec];
    const fecha=aFecha(bruta,anio);
    const conAnio=(bruta instanceof Date)||typeof bruta==='number'||/\d{4}/.test(String(bruta??''));
    IMPORT.pagos.push({hoja,nombre,empId:emp?emp.id:'',fecha,anioAuto:!conAnio,concepto:con||'Pago',
      hn:aNum(f[c.hn]),he:aNum(f[c.he]),sn:aNum(f[c.sn]),se:aNum(f[c.se]),sac:aNum(f[c.sac]),
      bon:aNum(f[c.bon]),ade:aNum(f[c.ade]),total:total,pago:String(f[c.pag]??''),obs:String(f[c.obs]??''),
      usar:!!fecha&&!!total});
  }
}

}

function aplicarImportacion(){
  const semana=lunesDe($('#impSem').value||hoyISO());
  let nuevas=0,pisadas=0,omitidas=0;
  IMPORT.filas.forEach(f=>{
    const fecha=fechaDeFila(f,semana);
    if(!f.usar||!f.empId||!fecha||!f.horas){if(f.usar)omitidas++;return}
    const ex=DB.fichajes.find(x=>x.empId===f.empId&&x.fecha===fecha);
    const datos={empId:f.empId,fecha,em:f.em,sm:f.sm,et:f.et,st:f.st,horas:f.horas,obs:f.obs||'',auto:false};
    if(ex){Object.assign(ex,datos);pisadas++}
    else{DB.fichajes.push(Object.assign({id:uid()},datos));nuevas++}
  });
  guardar();cerrar();HORAS.sem=semana;vHoras();
  toast(`${nuevas} jornadas nuevas, ${pisadas} actualizadas${omitidas?`, ${omitidas} sin cargar`:''}`);
}

/** Calcula todos los conceptos del período para un empleado. */
function calcularLiquidacion(empId,desde,hasta,liqId){
  const e=empleado(empId);
  const f=fichajesDe(empId,desde,hasta);
  const r=repartirHoras(f);
  const tarifaE=e.tarifaExtra||e.tarifa*(DB.config.factorExtra||1.5);
  const sueldoNormal=Math.round(r.normales*e.tarifa*100)/100;
  const sueldoExtra=Math.round(r.extras*tarifaE*100)/100;
  const enRango=m=>m.fecha>=desde&&m.fecha<=hasta;
  // Si se está reabriendo una liquidación guardada, se vuelven a contar los movimientos que ella misma aplicó.
  const libre=m=>!m.aplicado||(liqId&&m.liqId===liqId);
  const bonos=DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='bono'&&enRango(m)&&libre(m));
  const sacs=DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='sac'&&enRango(m)&&libre(m));
  const descs=DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='descuento'&&enRango(m)&&libre(m));
  const ades=DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='adelanto'&&m.fecha<=hasta
    &&(!m.saldado||(liqId&&m.liqId===liqId)));
  const imputado=m=>(m.imputaciones||[]).filter(i=>i.liqId===liqId).reduce((s,i)=>s+(+i.monto||0),0);
  const prests=DB.movimientos.filter(m=>m.empId===empId&&m.tipo==='prestamo'
    &&(saldoPrestamo(m)>0.5||(liqId&&imputado(m)>0)));
  const cuota=prests.reduce((s,p)=>s+Math.min(saldoPrestamo(p)+(liqId?imputado(p):0),+p.cuotaMonto||0),0);
  const bono=bonos.reduce((s,m)=>s+(+m.monto||0),0);
  const sac=sacs.reduce((s,m)=>s+(+m.monto||0),0);
  const desc=descs.reduce((s,m)=>s+(+m.monto||0),0);
  const adel=ades.reduce((s,m)=>s+(+m.monto||0),0);
  return {empId,desde,hasta,jornadas:f,hsNormales:r.normales,hsExtras:r.extras,tarifa:e.tarifa,tarifaExtra:tarifaE,
    sueldoNormal,sueldoExtra,bonos:bono,sac,descuentos:desc,adelantos:adel,cuotaPrestamo:Math.round(cuota*100)/100,
    idsBonos:bonos.map(m=>m.id),idsSac:sacs.map(m=>m.id),idsDesc:descs.map(m=>m.id),idsAdel:ades.map(m=>m.id),
    prestamos:prests.map(p=>({id:p.id,cuota:Math.min(saldoPrestamo(p)+(liqId?imputado(p):0),+p.cuotaMonto||0),saldo:saldoPrestamo(p)})),
    formaPago:e.formaPago||'Efectivo',
    get bruto(){return this.sueldoNormal+this.sueldoExtra+this.bonos+this.sac},
    get total(){return Math.round((this.bruto-this.descuentos-this.adelantos-this.cuotaPrestamo)*100)/100}};
}

function sugerirSac(empId){
  const hoy=new Date();const sem=hoy.getMonth()<6?[0,5]:[6,11];const y=hoy.getFullYear();
  const meses={};
  DB.liquidaciones.filter(l=>l.empId===empId).forEach(l=>{
    const d=dLoc(l.hasta);if(!d||d.getFullYear()!==y||d.getMonth()<sem[0]||d.getMonth()>sem[1])return;
    const k=l.hasta.slice(0,7);
    meses[k]=(meses[k]||0)+(+l.sueldoNormal||0)+(+l.sueldoExtra||0)+(+l.bonos||0);
  });
  const mejor=Math.max(0,...Object.values(meses));
  if(!mejor)return toast('Todavía no hay liquidaciones del semestre para calcularlo',true);
  $('#cSac').value=Math.round(mejor/2);
  $('#cSac').dispatchEvent(new Event('input'));
  toast(`Mejor mes del semestre: ${$0(mejor)}. Aguinaldo sugerido: la mitad.`);
}
function guardarLiquidacion(x,existente){
  const id=existente?existente.id:uid();
  if(existente)revertirAplicaciones(existente);
  // marcar adelantos cubiertos
  let resto=x.adelantos;
  x.idsAdel.forEach(mid=>{const m=DB.movimientos.find(z=>z.id===mid);if(!m)return;
    if(resto>=(+m.monto||0)-0.01){m.saldado=true;m.liqId=id;resto-=(+m.monto||0)}});
  // imputar cuota a préstamos
  let cuota=x.cuotaPrestamo;
  (x.prestamos||[]).forEach(p=>{if(cuota<=0)return;const m=DB.movimientos.find(z=>z.id===p.id);if(!m)return;
    const aplica=Math.min(cuota,saldoPrestamo(m));m.pagado=(+m.pagado||0)+aplica;
    (m.imputaciones=m.imputaciones||[]).push({liqId:id,monto:aplica});cuota-=aplica});
  [...x.idsBonos,...x.idsSac,...x.idsDesc].forEach(mid=>{const m=DB.movimientos.find(z=>z.id===mid);if(m){m.aplicado=true;m.liqId=id}});
  const reg={id,empId:x.empId,tipo:LIQ.tipo,concepto:nomPeriodo(LIQ.tipo,x.desde,x.hasta),
    desde:x.desde,hasta:x.hasta,hsNormales:x.hsNormales,hsExtras:x.hsExtras,tarifa:x.tarifa,tarifaExtra:x.tarifaExtra,
    sueldoNormal:x.sueldoNormal,sueldoExtra:x.sueldoExtra,sac:x.sac,bonos:x.bonos,descuentos:x.descuentos,
    adelantos:x.adelantos,cuotaPrestamo:x.cuotaPrestamo,total:x.total,formaPago:x.formaPago,obs:x.obs||'',
    idsAdel:x.idsAdel,idsBonos:x.idsBonos,idsSac:x.idsSac,idsDesc:x.idsDesc,
    imputaciones:(x.prestamos||[]).map(p=>({id:p.id,liqId:id,monto:Math.min(x.cuotaPrestamo,p.cuota)})),
    detalleDias:x.jornadas.map(f=>({fecha:f.fecha,em:f.em,sm:f.sm,et:f.et,st:f.st,horas:f.horas,obs:f.obs||''})),
    creada:new Date().toISOString()};
  const i=DB.liquidaciones.findIndex(l=>l.id===id);
  if(i>=0)DB.liquidaciones[i]=reg;else DB.liquidaciones.push(reg);
  guardar();return id;
}
function revertirAplicaciones(l){
  (l.idsAdel||[]).forEach(mid=>{const m=DB.movimientos.find(z=>z.id===mid);if(m&&m.liqId===l.id){m.saldado=false;delete m.liqId}});
  [...(l.idsBonos||[]),...(l.idsSac||[]),...(l.idsDesc||[])].forEach(mid=>{
    const m=DB.movimientos.find(z=>z.id===mid);if(m&&m.liqId===l.id){m.aplicado=false;delete m.liqId}});
  DB.movimientos.filter(m=>m.tipo==='prestamo'&&m.imputaciones).forEach(m=>{
    const q=m.imputaciones.filter(x=>x.liqId===l.id).reduce((s,x)=>s+x.monto,0);
    if(q){m.pagado=Math.max(0,(+m.pagado||0)-q);m.imputaciones=m.imputaciones.filter(x=>x.liqId!==l.id)}});
}
function anularLiq(id){
  const l=DB.liquidaciones.find(x=>x.id===id);
  confirmar('Anular liquidación',
    `Se borra la liquidación de <b>${esc(nomEmp(l.empId))}</b> por ${$0(l.total)} y vuelven a quedar pendientes los adelantos y cuotas que descontaba.`,
    ()=>{revertirAplicaciones(l);DB.liquidaciones=DB.liquidaciones.filter(x=>x.id!==id);
      guardar();cerrar();render();toast('Liquidación anulada')},'Anular');
}
function liquidarTodos(){

  const ya=pend.filter(c=>DB.liquidaciones.some(l=>l.empId===c.empId&&l.desde===desde&&l.hasta===hasta)).length;
  confirmar('Liquidar a todos',
    `Se van a generar ${pend.length} liquidaciones de ${nomPeriodo(LIQ.tipo,desde,hasta).toLowerCase()} por un total de <b>${$0(pend.reduce((s,c)=>s+c.total,0))}</b>.
     ${ya?`<br><br>${ya} ya estaban liquidadas y se van a reemplazar.`:''}
     <br><br>Los adelantos pendientes y las cuotas de préstamo se descuentan automáticamente.`,
    ()=>{pend.forEach(c=>{const ex=DB.liquidaciones.find(l=>l.empId===c.empId&&l.desde===desde&&l.hasta===hasta);
      guardarLiquidacion(Object.assign({},c,{bruto:c.bruto,total:c.total,obs:''}),ex)});
      vLiquidar();toast(`${pend.length} liquidaciones generadas`)},'Liquidar');
}

/* ======================== CIERRE MENSUAL ==========================
   Consolida lo pagado en el mes por empresa, con el mismo criterio y los
   mismos identificadores que la app del cierre de estados de resultados. */
let CIERRE={ym:mesActual()};
function totalesCierre(ym){
  const desde=ym+'-01',hasta=finDeMes(ym);
  const liqs=DB.liquidaciones.filter(l=>l.hasta>=desde&&l.hasta<=hasta);
  const porEmpresa={};
  empresas().forEach(x=>porEmpresa[x.id]={id:x.id,nombre:x.nombre,color:x.color,
    sueldos:0,extras:0,sac:0,bonos:0,descuentos:0,neto:0,horas:0,empleados:new Set()});
  porEmpresa['']={id:'',nombre:'Sin asignar',color:'#B0B0B8',
    sueldos:0,extras:0,sac:0,bonos:0,descuentos:0,neto:0,horas:0,empleados:new Set()};
  liqs.forEach(l=>{
    const e=empleado(l.empId);const k=(e&&e.empresa&&empresaDe(e.empresa))?e.empresa:'';
    const t=porEmpresa[k];
    t.sueldos+=+l.sueldoNormal||0;t.extras+=+l.sueldoExtra||0;t.sac+=+l.sac||0;t.bonos+=+l.bonos||0;
    t.descuentos+=(+l.adelantos||0)+(+l.cuotaPrestamo||0)+(+l.descuentos||0);
    t.neto+=+l.total||0;t.horas+=(+l.hsNormales||0)+(+l.hsExtras||0);
    t.empleados.add(l.empId);
  });
  return {desde,hasta,liqs,porEmpresa};
}
function vCierre(){
  const ym=CIERRE.ym,{desde,hasta,liqs,porEmpresa}=totalesCierre(ym);
  const grupos=Object.values(porEmpresa).filter(g=>g.neto||g.empleados.size);
  const totalMes=grupos.reduce((s,g)=>s+g.neto,0);
  const sinAsignar=porEmpresa[''].empleados.size;

  cabecera('Cierre mensual',`${nomMes(ym)} · lo que se pagó en sueldos`,
    `<input type="month" id="ciMes" value="${ym}" style="width:158px">
     <button class="btn ghost" onclick="exportarCierre()">Exportar para el cierre</button>
     <button class="btn" onclick="pdfCierre()">PDF del mes</button>`);

function copiar(txt){
  const ok=()=>toast('Copiado: '+txt);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok).catch(()=>toast('No se pudo copiar',true));
  else{const i=document.createElement('textarea');i.value=txt;document.body.appendChild(i);i.select();
    try{document.execCommand('copy');ok()}catch(e){toast('No se pudo copiar',true)}i.remove()}
}

/* ========================= PASIVO LABORAL =========================
   Estimación de la contingencia por desvinculación, con el marco de la
   Ley 27.802 (Modernización Laboral, vigente desde el 6 de marzo de 2026):
   art. 245 LCT sin cambios en la fórmula, pero con el SAC excluido de la base.
   NO es asesoramiento legal: son números para dimensionar el riesgo.       */
let PASIVO={ref:hoyISO(),costas:25,interes:60,meses:18,agrav:0,art80:false,prueba:6};

function mesesEntre(desde,hasta){
  const a=dLoc(desde),b=dLoc(hasta);if(!a||!b)return 0;
  let m=(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
  if(b.getDate()<a.getDate())m--;
  return Math.max(0,m);
}
/** Mejor remuneración mensual normal y habitual del último año, sin SAC ni bonos. */
function baseIndemnizatoria(e,ref){
  if(+e.baseIndem>0)return {base:+e.baseIndem,origen:'fijada a mano'};
  const desde=sumaDias(ref,-365);
  const meses={};
  DB.liquidaciones.filter(l=>l.empId===e.id&&l.hasta>=desde&&l.hasta<=ref).forEach(l=>{
    const k=l.hasta.slice(0,7);
    meses[k]=(meses[k]||0)+(+l.sueldoNormal||0)+(+l.sueldoExtra||0);
  });
  const vals=Object.values(meses);
  if(vals.length)return {base:Math.max(...vals),origen:`mejor mes de ${vals.length} liquidado${vals.length===1?'':'s'}`};
  const est=jornadaDe(e)*diasDe(e).length*4.33*(+e.tarifa||0);
  return {base:Math.round(est),origen:'estimada por jornada y tarifa'};
}
function calcularPasivo(e,p){
  const ref=p.ref||hoyISO();
  const mesesTot=e.ingreso?mesesEntre(e.ingreso,ref):0;
  const aniosReales=mesesTot/12;
  const resto=mesesTot%12;
  const aniosArt245=Math.max(1,Math.floor(mesesTot/12)+(resto>3?1:0));
  const {base,origen}=baseIndemnizatoria(e,ref);
  const enPrueba=e.ingreso&&mesesTot<(+p.prueba||6);

  const antiguedad=enPrueba?0:Math.round(base*aniosArt245);
  const mesesPreaviso=aniosReales>=5?2:1;
  const preaviso=enPrueba?0:Math.round(base*mesesPreaviso);
  const sacPreaviso=enPrueba?0:Math.round(preaviso/12);
  const d=dLoc(ref),ultimo=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const integracion=enPrueba?0:Math.round(base*((ultimo-d.getDate())/ultimo));
  const sacInteg=enPrueba?0:Math.round(integracion/12);
  // SAC proporcional del semestre en curso, contando desde el ingreso si entró dentro del semestre
  const iniSem=d.getMonth()<6?`${d.getFullYear()}-01-01`:`${d.getFullYear()}-07-01`;
  const desdeSem=(e.ingreso&&e.ingreso>iniSem)?e.ingreso:iniSem;
  const diasSem=Math.max(0,Math.round((d-dLoc(desdeSem))/86400000));
  const sacProp=Math.round((base/2)*(Math.min(diasSem,182)/182));
  // vacaciones proporcionales no gozadas, sobre los meses realmente trabajados en el año
  const diasVac=diasVacaciones(e.ingreso)||14;
  const mesesAnio=Math.min(d.getMonth()+1,mesesTot||d.getMonth()+1);
  const vacaciones=Math.round((diasVac*(mesesAnio/12))*(base/25));
  const sacVac=Math.round(vacaciones/12);

  const subtotal=antiguedad+preaviso+sacPreaviso+integracion+sacInteg+sacProp+vacaciones+sacVac;
  const agravado=Math.round(subtotal*((+p.agrav||0)/100));
  const art80=p.art80&&!enPrueba?Math.round(base*3):0;
  const capital=subtotal+agravado+art80;
  const interes=Math.round(capital*((+p.interes||0)/100)*((+p.meses||0)/12));
  const costas=Math.round((capital+interes)*((+p.costas||0)/100));
  return {base,origen,mesesTot,aniosReales,aniosArt245,enPrueba,
    antiguedad,preaviso,sacPreaviso,integracion,sacInteg,sacProp,vacaciones,sacVac,
    subtotal,agravado,art80,capital,interes,costas,total:capital+interes+costas};
}

  const conFecha=activos.filter(e=>e.ingreso).length;
  const mayor=activos.map(e=>({e,c:calcularPasivo(e,p)})).sort((a,b)=>b.c.total-a.c.total)[0];

  ${conFecha<activos.length?`<div class="alerta">${activos.length-conFecha} empleado${activos.length-conFecha===1?'':'s'}
    sin fecha de ingreso cargada: su antigüedad se toma como cero y el número queda corto. Cargala en su ficha.</div>`:''}
  <div class="kpis">
    <div class="kpi"><div class="k">Pasivo total estimado</div><div class="v">${$0(tot)}</div>
      <div class="m">${activos.length} empleados activos</div></div>
    <div class="kpi"><div class="k">Promedio por empleado</div><div class="v">${$0(activos.length?tot/activos.length:0)}</div>
      <div class="m">si se fueran todos juntos</div></div>
    <div class="kpi"><div class="k">Mayor exposición</div><div class="v" style="font-size:20px">${mayor?esc(mayor.e.nombre):'—'}</div>
      <div class="m">${mayor?$0(mayor.c.total)+' · '+mayor.c.aniosArt245+' años':''}</div></div>
    <div class="kpi"><div class="k">Costo de un mes</div><div class="v">${$0(activos.reduce((s,e)=>s+baseIndemnizatoria(e,p.ref).base,0))}</div>
      <div class="m">suma de las bases indemnizatorias</div></div>
  </div>

  <div class="panel"><h3>Supuestos del cálculo</h3><div class="body">
    <div class="grid g4">
      <div class="f"><label>Fecha de referencia</label><input type="date" id="paRef" value="${p.ref}"></div>
      <div class="f"><label>Período de prueba (meses)</label><input type="number" id="paPru" value="${p.prueba}"></div>
      <div class="f"><label>Honorarios y costas (%)</label><input type="number" id="paCos" value="${p.costas}"></div>

    <p class="note">La Ley 27.742 derogó las multas de la Ley 24.013 (arts. 8, 9, 10 y 15) y de la Ley 25.323 (arts. 1 y 2),

  <div class="panel"><h3>Detalle por empleado<span class="sp"></span>

      <thead><tr><th>Empleado</th><th>Ingreso</th><th>Antigüedad</th><th class="n">Años art. 245</th>

        <th class="n">SAC y vacaciones</th><th class="n">Intereses y costas</th><th class="n">Total</th><th></th></tr></thead>
      <tbody>${filas||'<tr><td colspan="11" class="empty"><strong>Sin empleados activos</strong></td></tr>'}</tbody>

  $('#paRef').onchange=e=>{PASIVO.ref=e.target.value;vPasivo()};

function fijarBase(id,v){const e=empleado(id);e.baseIndem=+v||0;guardar();vPasivo();toast('Base fijada a mano')}
function verPasivo(id){
  const e=empleado(id),c=calcularPasivo(e,PASIVO);
  const l=(t,v,nota)=>v?`<div class="rline"><span>${t}${nota?` <span class="note">${nota}</span>`:''}</span><b>${$$(v)}</b></div>`:'';
  abrir(`<h3>${esc(e.nombre)} — pasivo estimado</h3><div class="mbody">
    <p class="note" style="margin-bottom:12px">Antigüedad al ${fFecha(PASIVO.ref)}:
      ${Math.floor(c.mesesTot/12)} años y ${c.mesesTot%12} meses · cuenta como ${c.aniosArt245} año${c.aniosArt245===1?'':'s'}
      para el art. 245 · base ${$$(c.base)} (${esc(c.origen)}).</p>
    ${c.enPrueba?`<div class="alerta">Está dentro del período de prueba de ${PASIVO.prueba} meses:
      no corresponde indemnización por antigüedad ni preaviso, solo la liquidación final.</div>`:''}
    ${l('Indemnización por antigüedad',c.antiguedad,`art. 245 · ${c.aniosArt245} × base`)}
    ${l('Preaviso omitido',c.preaviso,`art. 232 · ${c.aniosReales>=5?'2 meses':'1 mes'}`)}
    ${l('SAC sobre preaviso',c.sacPreaviso)}
    ${l('Integración del mes de despido',c.integracion,'art. 233')}
    ${l('SAC sobre integración',c.sacInteg)}
    ${l('SAC proporcional del semestre',c.sacProp)}
    ${l('Vacaciones proporcionales no gozadas',c.vacaciones,'art. 156')}
    ${l('SAC sobre vacaciones',c.sacVac)}
    <div class="rline tot"><span>Subtotal de la liquidación</span><b>${$$(c.subtotal)}</b></div>
    ${l('Agravamiento por falta de registración',c.agravado,PASIVO.agrav+'%')}

function saldoRestanteTexto(l){
  const p=(l.imputaciones||[]).map(i=>DB.movimientos.find(m=>m.id===i.id)).filter(Boolean);

    head:[['Empleado','Hs','Extras','Haberes','Descuentos','Neto','Pago']],
    body:liqs.map(l=>{const d=(+l.adelantos||0)+(+l.cuotaPrestamo||0)+(+l.descuentos||0);
      return [nomEmp(l.empId),hs(l.hsNormales),l.hsExtras?hs(l.hsExtras):'-',
      $0((+l.sueldoNormal||0)+(+l.sueldoExtra||0)+(+l.sac||0)+(+l.bonos||0)),
      d?'- '+$0(d):'-',$0(l.total),l.formaPago||'']}),
    foot:[[{content:`Total a pagar — ${liqs.length} empleado${liqs.length===1?'':'s'}`,colSpan:5,styles:{halign:'right'}},
           $0(tot),'']],
    theme:'plain',styles:{fontSize:9,cellPadding:2.2},
    headStyles:{fontStyle:'bold',fontSize:7.5,textColor:[104,119,127],lineWidth:{bottom:.3},lineColor:[200,206,198]},
    footStyles:{fontStyle:'bold',fontSize:10,lineWidth:{top:.5},lineColor:[22,33,43]},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right',textColor:[168,73,60]},5:{halign:'right',fontStyle:'bold'}}});
  y=doc.lastAutoTable.finalY+12;
  const deuda=DB.empleados.filter(e=>pendientesTotal(e.id).total>0.5);
  if(deuda.length){
    doc.setFontSize(11);doc.setFont('times','normal');doc.text('Saldos pendientes al cierre',14,y);y+=4;
    doc.autoTable({startY:y,margin:{left:14,right:14},
      head:[['Empleado','Adelantos','Préstamos','Total']],
      body:deuda.map(e=>{const p=pendientesTotal(e.id);return[e.nombre,$0(p.adelantos),$0(p.prestamos),$0(p.total)]}),
      theme:'plain',styles:{fontSize:9,cellPadding:2},
      headStyles:{fontStyle:'bold',fontSize:7.5,textColor:[104,119,127],lineWidth:{bottom:.3},lineColor:[200,206,198]},
      columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right',fontStyle:'bold'}}});
  }
  doc.setFontSize(7.5);doc.setTextColor(104,119,127);
  doc.text(`Emitido el ${fLarga(hoyISO())}`,105,286,{align:'center'});
  doc.save(`resumen_pagos_${desde}_${hasta}.pdf`);
  toast('Resumen descargado');
}

/* ============================ ARRANQUE ============================ */
async function iniciar(){
  let remoto=null, fallo=false;
  try{
    const res=await fetch(API_SUELDOS,{headers:authHeaders()});
    if(res.status===401){window.location.href='../login/login.html';return}
    if(res.status===403){window.location.href='../selector/selector.html';return}
    if(!res.ok) throw new Error('HTTP '+res.status);
    remoto=await res.json();
  }catch(e){ fallo=true; }

  if(fallo){
    DB=leerDisco()||JSON.parse(JSON.stringify(SEMILLA));
    SIN_GUARDADO=true;
  }else if(remoto){
    DB=remoto;
    SIN_GUARDADO=false;
  }else{
    DB=JSON.parse(JSON.stringify(SEMILLA));
    SIN_GUARDADO=false;
    guardar();
  }
  ['config','empleados','fichajes','movimientos','liquidaciones'].forEach(k=>{if(!DB[k])DB[k]=SEMILLA[k]});
  render();
}
iniciar();
</script>
