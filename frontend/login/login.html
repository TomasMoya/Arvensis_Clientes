<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Arvensis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles_login.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <div class="wrapper">
    <div class="card">
      <div class="card-header">
        <div class="logo-mark">
          <img src="..\images\logoaromaherba.webp" width="52" height="52" class="logos"/>
          <img src="..\images\logoarvensis.jpg" width="52" height="52" class="logos"/>
          <img src="..\images\logoessence.webp" width="60" height="42" class="logos"/>
        </div>
        <div class="card-title">Bienvenido</div>
        <div class="card-sub">Ingresá tus credenciales para continuar</div>
      </div>

      <div class="form">
        <div class="form-row">
          <label class="form-label">Usuario</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="login" placeholder="Tu usuario" autocomplete="username" />
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="clave" placeholder="Tu contraseña" autocomplete="current-password" />
            <button class="toggle-pass" type="button" onclick="togglePassword()" id="toggle-pass-btn">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="error-msg" id="error-msg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="error-text">Credenciales incorrectas</span>
        </div>

        <button class="btn-login" id="btn-login" onclick="iniciarSesion()">
          <span id="btn-text">Ingresar</span>
          <div class="spinner" id="spinner" style="display:none"></div>
        </button>
      </div>

      <div class="card-footer">
        <span class="footer-text">arvensis · v2.2</span>
      </div>
    </div>
  </div>

  <script src="login_script.js"></script>
</body>
</html>
