<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario — Arvensis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles_calendario.css" />
</head>
<body>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="logo-name">Clientes</div>
      <div class="logo-sub">v3.1 · arvensis</div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clientes
      </a>
      <a class="nav-item" href="../sin-compra/sin-compra.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Sin compra
        <span class="nav-dot" id="nav-dot-sincompra" style="display:none"></span>
      </a>
      <a class="nav-item" href="../usuarios/usuarios.html" id="nav-usuarios" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Usuarios
      </a>
      <div class="nav-item-group">
        <button class="nav-item nav-item-toggle" onclick="toggleTareasMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Tareas
          <svg class="chevron" id="chevron-tareas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="nav-submenu" id="submenu-tareas">
          <a class="nav-subitem" href="../tareas/tareas.html" id="nav-mis-tareas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a7 7 0 0 1 13 0"/></svg>
            Mis tareas
          </a>
          <div id="nav-grupos"></div>
          <button class="nav-subitem" onclick="openModalCrearGrupo()" style="background:none;border:none;width:100%;text-align:left;cursor:pointer;font-family:var(--sans)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Crear grupo
          </button>
        </div>
        <a class="nav-item" href="../calendario/calendario.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendario
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div>arvensis-gestion.com.ar</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div>
          <div class="page-title">Calendario</div>
          <div class="page-sub" id="page-sub">Próximos 30 días</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="legend">
          <span class="legend-item"><span class="legend-dot dot-tarea"></span>Tarea</span>
          <span class="legend-item"><span class="legend-dot dot-mensual"></span>Obj. mensual</span>
          <span class="legend-item"><span class="legend-dot dot-trimestral"></span>Obj. trimestral</span>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="cal-wrap" id="cal-wrap">
        <div class="cal-grid" id="cal-grid">
          <!-- generado por JS -->
        </div>
      </div>
    </main>
  </div>
</div>

<!-- MODAL EDITAR TAREA -->
<div class="modal-overlay" id="modal-editar" onclick="if(event.target===this)closeModal('modal-editar')">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Editar tarea</div>
        <div class="modal-sub" id="modal-origen">—</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-editar')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">Título *</label>
        <input type="text" id="e-titulo" />
      </div>
      <div class="form-row full">
        <label class="form-label">Descripción</label>
        <textarea id="e-descripcion" rows="3"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">Fecha límite</label>
        <input type="datetime-local" id="e-fechalimite" />
      </div>
      <div class="form-row">
        <label class="form-label">Prioridad</label>
        <select id="e-prioridad">
          <option value="">Sin prioridad</option>
          <option value="BAJA">Baja</option>
          <option value="MEDIA">Media</option>
          <option value="ALTA">Alta</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Estado</label>
        <select id="e-estado">
          <option value="PENDIENTE">Pendiente</option>
          <option value="PROCESANDO">Procesando</option>
          <option value="FINALIZADA">Finalizada</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">Tipo</label>
        <select id="e-tipo">
          <option value="TAREA">Tarea</option>
          <option value="OBJETIVO_MENSUAL">Obj. mensual</option>
          <option value="OBJETIVO_TRIMESTRAL">Obj. trimestral</option>
        </select>
      </div>
    </div>
    <div class="form-error" id="form-error-editar">El título es obligatorio.</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-editar')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitEditar()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span class="toast-icon" id="toast-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </span>
  <span id="toast-msg"></span>
</div>

<!-- MODAL CREAR GRUPO DE TAREAS -->
<div class="modal-overlay" id="modal-crear-grupo" onclick="if(event.target===this)closeModal('modal-crear-grupo')">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Nuevo grupo</div>
        <div class="modal-sub">Creá un grupo de tareas compartido.</div>
      </div>
      <button class="modal-close" onclick="closeModal('modal-crear-grupo')">×</button>
    </div>
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">Nombre *</label>
        <input type="text" id="g-nombre" placeholder="Ej: Atención al cliente" />
      </div>
      <div class="form-row full">
        <label class="form-label">Descripción</label>
        <input type="text" id="g-descripcion" placeholder="Descripción del grupo" />
      </div>
    </div>
    <div class="form-error" id="form-error-grupo">El nombre es obligatorio.</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-crear-grupo')">Cancelar</button>
      <button class="btn btn-primary" onclick="submitCrearGrupo()">Crear grupo</button>
    </div>
  </div>
</div>

<script src="calendario_script.js"></script>
</body>
</html>
