name: Deploy to Cloud

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Execute Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY  }}
          port: ${{ secrets.PORT }}

          script: |
            cd DeployDonWeb/Arvensis_Clientes && \
            git pull && \
            docker-compose down && \
            docker-compose up --build -d
